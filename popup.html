<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --blue: #1868db;
        --blue-dark: #1558bc;
        --blue-tint: #e9f2ff;
        --bg: #ffffff;
        --bg-sunken: #f7f8f9;
        --fg: #172b4d;
        --muted: #5e6c84;
        --faint: #626f86;
        --border: #dfe1e6;
        --border-strong: #c1c7d0;
        --btn-bg: #ffffff;
        --btn-bg-hover: #f4f5f7;
        --ok: #216e4e;
        --ok-bg: #e6f5ef;
        --err: #c9372c;
        --warn: #974f0c;
        --warn-bg: #fff7d6;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        --shadow: 0 1px 2px rgba(9, 30, 66, .08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --blue: #669df1;
          --blue-dark: #8fb8f6;
          --blue-tint: #1c2b41;
          --bg: #1d2125;
          --bg-sunken: #22272b;
          --fg: #c7d1db;
          --muted: #9aa7b5;
          --faint: #8c99a8;
          --border: #38414a;
          --border-strong: #4c5560;
          --btn-bg: #22272b;
          --btn-bg-hover: #282e33;
          --ok: #7ee2b8;
          --ok-bg: #1c3329;
          --err: #fd9891;
          --warn: #f5cd47;
          --warn-bg: #332e1b;
          --shadow: 0 1px 2px rgba(0, 0, 0, .3);
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 360px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      h1, h2 {
        font-size: 11px;
        font-weight: 700;
        margin: 0 0 10px;
        color: var(--faint);
        text-transform: uppercase;
        letter-spacing: .07em;
      }
      h2 { margin: 0; }
      /* --- En-tête du ticket --- */
      .head {
        background: var(--bg-sunken);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 12px 10px;
        margin-bottom: 12px;
      }
      .key {
        font-weight: 700;
        font-size: 15px;
        letter-spacing: .01em;
        color: var(--blue);
        font-family: var(--mono);
      }
      .title {
        margin: 3px 0 0;
        color: var(--fg);
        font-weight: 500;
        word-break: break-word;
      }
      .head .title { margin-bottom: 0; }
      .meta { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }
      .chip {
        font-size: 11px;
        line-height: 1.5;
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 1px 9px;
      }
      .chip b { color: var(--fg); font-weight: 600; }
      /* Puces colorées selon le champ / la valeur */
      .chip-type { border-color: #8fb8f6; }
      .chip-prio[data-value*="high"], .chip-prio[data-value*="haut"],
      .chip-prio[data-value*="élev"], .chip-prio[data-value*="critical"],
      .chip-prio[data-value*="block"] { border-color: #e5735f; }
      .chip-prio[data-value*="low"], .chip-prio[data-value*="bas"],
      .chip-prio[data-value*="minor"] { border-color: #7ee2b8; }
      .chip-status[data-value*="done"], .chip-status[data-value*="terminé"],
      .chip-status[data-value*="closed"], .chip-status[data-value*="résolu"] {
        border-color: #7ee2b8; color: var(--ok);
      }
      .chip-status[data-value*="progress"], .chip-status[data-value*="cours"] {
        border-color: #8fb8f6; color: var(--blue);
      }
      /* Badge « dernier utilisé » */
      .badge {
        display: inline-block;
        margin-left: 6px;
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .04em;
        color: var(--blue-dark);
        background: var(--blue-tint);
        border-radius: 999px;
        padding: 0 6px;
        vertical-align: middle;
      }
      /* Saisie manuelle de clé */
      .manual { display: flex; gap: 6px; margin-top: 10px; }
      .manual input {
        flex: 1 1 auto;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 9px;
        font: inherit;
      }
      .manual button { width: auto; flex: 0 0 auto; justify-content: center; }
      .manual button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
      /* Multi-tickets : sélection */
      .multi-head { display: flex; justify-content: space-between; align-items: baseline; }
      .multi-head a { color: var(--faint); font-size: 12px; text-decoration: none; }
      .multi-head a:hover { color: var(--blue); text-decoration: underline; }
      .multi-list { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 8px; max-height: 168px; overflow: auto; }
      .multi-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 3px 4px;
        border-radius: 6px;
        cursor: pointer;
      }
      .multi-row:hover { background: var(--bg-sunken); }
      .multi-row input { flex: 0 0 auto; align-self: center; }
      /* --- Boutons de format --- */
      .btns { display: flex; flex-direction: column; gap: 6px; }
      button {
        appearance: none;
        width: 100%;
        border: 1px solid var(--border);
        background: var(--btn-bg);
        color: var(--fg);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background .12s, border-color .12s, box-shadow .12s;
      }
      button:hover {
        background: var(--btn-bg-hover);
        border-color: var(--border-strong);
        box-shadow: var(--shadow);
      }
      button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
      .ico {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        background: var(--bg-sunken);
        font-size: 14px;
        line-height: 1;
      }
      .ico svg { display: block; }
      .body { min-width: 0; flex: 1 1 auto; }
      .label { display: block; font-weight: 600; }
      .preview {
        display: block;
        margin-top: 1px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .copy-hint {
        flex: 0 0 auto;
        font-size: 11px;
        color: var(--muted);
        opacity: 0;
        transition: opacity .12s;
      }
      button:hover .copy-hint { opacity: 1; }
      /* Badge de raccourci clavier, visible en permanence (découvrabilité) */
      .hotkey {
        flex: 0 0 auto;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        display: grid;
        place-items: center;
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        background: var(--bg-sunken);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-family: var(--mono);
      }
      button.primary .hotkey { border-color: var(--blue); color: var(--blue-dark); background: var(--bg); }
      button.copied .hotkey { border-color: var(--ok); color: var(--ok); }
      /* Ligne d'aide des raccourcis, en pied de popup */
      .shortcuts-help {
        margin-top: 12px;
        font-size: 11px;
        color: var(--faint);
        text-align: center;
      }
      .shortcuts-help kbd {
        font-family: var(--mono);
        font-size: 10px;
        background: var(--bg-sunken);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0 4px;
      }
      /* Sections repliables (Récents, Multi-tickets) */
      details.section {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      details.section > summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        color: var(--faint);
        text-transform: uppercase;
        letter-spacing: .07em;
      }
      details.section > summary::-webkit-details-marker { display: none; }
      details.section > summary::before { content: "\25B8"; font-size: 9px; }
      details.section[open] > summary::before { content: "\25BE"; }
      details.section > summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
      .sec-count { margin-left: auto; font-weight: 600; color: var(--muted); text-transform: none; letter-spacing: 0; }
      .sec-actions { display: flex; justify-content: flex-end; margin: 6px 0 2px; }
      .sec-actions a { color: var(--faint); font-size: 12px; text-decoration: none; }
      .sec-actions a:hover { color: var(--blue); text-decoration: underline; }
      .empty-note { margin: 6px 0 2px; font-size: 12px; color: var(--faint); }
      /* Format principal mis en avant */
      button.primary {
        border-color: var(--blue);
        background: var(--blue-tint);
      }
      button.primary .ico { background: var(--blue); color: #fff; }
      button.primary .label { color: var(--blue-dark); }
      /* État « copié » */
      button.copied,
      button.copied:hover {
        border-color: var(--ok);
        background: var(--ok-bg);
      }
      button.copied .ico { background: var(--ok); color: #fff; }
      button.copied .label { color: var(--ok); }
      .error { color: var(--err); }
      /* État de chargement (détection du ticket) */
      .loading {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 2px;
        color: var(--muted);
      }
      .spinner {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        border: 2px solid var(--border);
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: jtc-spin .7s linear infinite;
      }
      @keyframes jtc-spin { to { transform: rotate(360deg); } }
      /* État vide (aucun ticket détecté) */
      .empty-state { text-align: center; padding: 10px 4px 4px; }
      .empty-icon {
        width: 44px;
        height: 44px;
        margin: 0 auto 10px;
        display: grid;
        place-items: center;
        color: var(--faint);
        background: var(--bg-sunken);
        border: 1px solid var(--border);
        border-radius: 50%;
      }
      .empty-icon svg { display: block; }
      .empty-msg { color: var(--fg); font-weight: 600; }
      .empty-hint { margin-top: 4px; color: var(--muted); font-size: 12px; }
      #status {
        margin-top: 10px;
        min-height: 16px;
        font-size: 12px;
        color: var(--ok);
        font-family: var(--mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #status.error { color: var(--err); }
      .foot { margin-top: 12px; }
      .foot a, .hist-head a {
        color: var(--faint);
        font-size: 12px;
        text-decoration: none;
      }
      .foot a:hover, .hist-head a:hover { color: var(--blue); text-decoration: underline; }
      .foot-hint { margin-top: 6px; font-size: 11px; color: var(--faint); }
      .foot kbd {
        font-family: var(--mono);
        font-size: 10px;
        background: var(--bg-sunken);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 0 4px;
      }
      .hist-head { display: flex; justify-content: space-between; align-items: baseline; }
      .hist-item .body { display: flex; align-items: baseline; gap: 8px; }
      .hist-key { font-weight: 700; color: var(--blue); font-family: var(--mono); flex: 0 0 auto; }
      .hist-title {
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* --- Auto-assignation (identique au panneau latéral) --- */
      #assign:not(:empty) {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .assign-list { display: flex; flex-wrap: wrap; gap: 6px; }
      .assign-btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        width: auto;
        max-width: 100%;
        border: 1px solid var(--border);
        background: var(--btn-bg);
        color: var(--fg);
        border-radius: 999px;
        padding: 4px 11px 4px 4px;
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        transition: background .12s, border-color .12s, box-shadow .12s;
      }
      .assign-btn:hover {
        background: var(--btn-bg-hover);
        border-color: var(--border-strong);
        box-shadow: var(--shadow);
      }
      .assign-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
      .assign-btn.done {
        border-color: var(--ok);
        background: var(--ok-bg);
        color: var(--ok);
      }
      /* État « armé » : en attente d'un 2e clic de confirmation */
      .assign-btn.confirm {
        border-color: var(--warn);
        background: var(--warn-bg);
        color: var(--warn);
        font-weight: 600;
      }
      .assign-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .assign-manage-toggle {
        display: inline-block;
        margin-top: 10px;
        color: var(--faint);
        font-size: 12px;
        text-decoration: none;
        cursor: pointer;
      }
      .assign-manage-toggle:hover { color: var(--blue); text-decoration: underline; }
      .assign-manage { margin-top: 8px; }
      .assign-current { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .assign-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--bg-sunken);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 4px;
        font-size: 12px;
      }
      .assign-chip-name { color: var(--fg); }
      .assign-chip-rm {
        appearance: none;
        width: auto;
        border: none;
        background: transparent;
        color: var(--faint);
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
        padding: 0 2px;
      }
      .assign-chip-rm:hover { color: var(--err); background: transparent; box-shadow: none; }
      .assign-search {
        width: 100%;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 9px;
        font: inherit;
        font-size: 13px;
      }
      .assign-search:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
      .assign-search:disabled { opacity: .55; cursor: not-allowed; }
      .assign-results {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 6px;
        max-height: 180px;
        overflow: auto;
      }
      .assign-result {
        appearance: none;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        border: 1px solid transparent;
        background: transparent;
        color: var(--fg);
        border-radius: 6px;
        padding: 4px 6px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .assign-result:hover { background: var(--bg-sunken); border-color: var(--border); box-shadow: none; }
      .assign-result.in-list { opacity: .5; cursor: default; }
      .assign-note { margin-top: 6px; min-height: 14px; font-size: 12px; color: var(--muted); }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
        .spinner { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <h1>Ticket Jira</h1>
    <div id="content">
      <div class="title">Détection en cours…</div>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="assign"></div>
    <div id="multi"></div>
    <div id="history"></div>
    <div id="foot" class="foot"></div>

    <script src="settings.js"></script>
    <script src="template-engine.js"></script>
    <script src="extract-core.js"></script>
    <script src="i18n.js"></script>
    <script src="extract-fn.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
