<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --blue: #1868db;
        --blue-dark: #1558bc;
        --blue-tint: #e9f2ff;
        --bg: #ffffff;
        --bg-sunken: #f7f8f9;
        --fg: #172b4d;
        --muted: #626f86;
        --faint: #8993a4;
        --border: #dfe1e6;
        --border-strong: #c1c7d0;
        --btn-bg: #ffffff;
        --btn-bg-hover: #f4f5f7;
        --ok: #216e4e;
        --ok-bg: #e6f5ef;
        --err: #c9372c;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        --shadow: 0 1px 2px rgba(9, 30, 66, .08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --blue: #669df1;
          --blue-dark: #8fb8f6;
          --blue-tint: #1c2b41;
          --bg: #1d2125;
          --bg-sunken: #22272b;
          --fg: #c7d1db;
          --muted: #96a0ab;
          --faint: #738496;
          --border: #38414a;
          --border-strong: #4c5560;
          --btn-bg: #22272b;
          --btn-bg-hover: #282e33;
          --ok: #7ee2b8;
          --ok-bg: #1c3329;
          --err: #fd9891;
          --shadow: 0 1px 2px rgba(0, 0, 0, .3);
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 360px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      h1 {
        font-size: 11px;
        font-weight: 700;
        margin: 0 0 10px;
        color: var(--faint);
        text-transform: uppercase;
        letter-spacing: .07em;
      }
      /* --- En-tête du ticket --- */
      .head {
        background: var(--bg-sunken);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 12px 10px;
        margin-bottom: 12px;
      }
      .key {
        font-weight: 700;
        font-size: 15px;
        letter-spacing: .01em;
        color: var(--blue);
        font-family: var(--mono);
      }
      .title {
        margin: 3px 0 0;
        color: var(--fg);
        font-weight: 500;
        word-break: break-word;
      }
      .head .title { margin-bottom: 0; }
      .meta { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 0; }
      .chip {
        font-size: 11px;
        line-height: 1.5;
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 1px 9px;
      }
      .chip b { color: var(--fg); font-weight: 600; }
      /* --- Boutons de format --- */
      .btns { display: flex; flex-direction: column; gap: 6px; }
      button {
        appearance: none;
        width: 100%;
        border: 1px solid var(--border);
        background: var(--btn-bg);
        color: var(--fg);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background .12s, border-color .12s, box-shadow .12s;
      }
      button:hover {
        background: var(--btn-bg-hover);
        border-color: var(--border-strong);
        box-shadow: var(--shadow);
      }
      button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
      .ico {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        background: var(--bg-sunken);
        font-size: 14px;
        line-height: 1;
      }
      .body { min-width: 0; flex: 1 1 auto; }
      .label { display: block; font-weight: 600; }
      .preview {
        display: block;
        margin-top: 1px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .copy-hint {
        flex: 0 0 auto;
        font-size: 11px;
        color: var(--faint);
        opacity: 0;
        transition: opacity .12s;
      }
      button:hover .copy-hint { opacity: 1; }
      /* Format principal mis en avant */
      button.primary {
        border-color: var(--blue);
        background: var(--blue-tint);
      }
      button.primary .ico { background: var(--blue); color: #fff; }
      button.primary .label { color: var(--blue-dark); }
      /* État « copié » */
      button.copied,
      button.copied:hover {
        border-color: var(--ok);
        background: var(--ok-bg);
      }
      button.copied .ico { background: var(--ok); color: #fff; }
      button.copied .label { color: var(--ok); }
      .error { color: var(--err); }
      #status {
        margin-top: 10px;
        min-height: 16px;
        font-size: 12px;
        color: var(--ok);
        font-family: var(--mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #status.error { color: var(--err); }
      .foot { margin-top: 12px; }
      .foot a, .hist-head a {
        color: var(--faint);
        font-size: 12px;
        text-decoration: none;
      }
      .foot a:hover, .hist-head a:hover { color: var(--blue); text-decoration: underline; }
      #multi:not(:empty), #history:not(:empty) {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .hist-head { display: flex; justify-content: space-between; align-items: baseline; }
      .hist-item .body { display: flex; align-items: baseline; gap: 8px; }
      .hist-key { font-weight: 700; color: var(--blue); font-family: var(--mono); flex: 0 0 auto; }
      .hist-title {
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <h1>Ticket Jira</h1>
    <div id="content">
      <div class="title">Détection en cours…</div>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="multi"></div>
    <div id="history"></div>

    <script src="settings.js"></script>
    <script src="extract-fn.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
